<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediDeutsch · A1 · Modalverben auf Station</title>
<meta name="description" content="MediDeutsch demo lesson: German modal verbs in a hospital setting (A1).">
<style>
:root{
  --teal:#0d9488; --teal-2:#14b8a6; --teal-50:#e6f7f5; --teal-100:#ccefeb;
  --blue:#2563eb; --blue-50:#eaf1fe; --navy:#0f2a3d; --ink:#1e3a4c; --muted:#5b7486;
  --bg:#f2f8fa; --card:#ffffff; --line:#dbe8ee;
  --ok:#16a34a; --ok-50:#e9f8ee; --bad:#e11d48; --bad-50:#fdecef; --warn:#f59e0b; --warn-50:#fff6e5;
  --der:#2563eb; --die:#e11d48; --das:#16a34a;
  --radius:18px; --shadow:0 6px 24px rgba(15,42,61,.08), 0 1px 3px rgba(15,42,61,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,"Noto Sans",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(circle at 10% 0%,#dff4f1 0,transparent 40%),radial-gradient(circle at 100% 10%,#e3ecfd 0,transparent 35%);background-attachment:fixed}
button{font:inherit;cursor:pointer}
.emoji{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}

/* Header */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--navy);letter-spacing:-.02em;white-space:nowrap}
.brand b{color:var(--teal)}
.brand-logo{width:36px;height:36px;flex:none}
.lesson-pill{display:flex;flex-direction:column;line-height:1.2;padding-left:16px;border-left:1px solid var(--line);min-width:0}
.lesson-pill .lvl{font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em}
.lesson-pill .ttl{font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-pill{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--warn-50);border:1px solid #fde3b0;border-radius:999px;padding:6px 14px;font-weight:700;color:#92590a;white-space:nowrap}
.score-pill .pts{font-variant-numeric:tabular-nums}
.score-pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.15)}}
.mini-stars{letter-spacing:1px;font-size:14px}
.mini-stars .off{filter:grayscale(1);opacity:.35}

/* Progress */
.progress-wrap{max-width:1040px;margin:0 auto;padding:14px 20px 0}
.progress-track{height:8px;background:#dcebf0;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:99px;transition:width .5s cubic-bezier(.4,1.4,.6,1)}
.steps{display:flex;justify-content:space-between;margin-top:10px;gap:4px}
.step-dot{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:2px;color:var(--muted);font-size:12px;font-weight:600;min-width:0}
.step-dot .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);font-size:13px;transition:.25s}
.step-dot.done .n{background:var(--teal-50);border-color:var(--teal-2);color:var(--teal)}
.step-dot.active .n{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 0 0 5px var(--teal-100)}
.step-dot.active{color:var(--navy)}
.step-dot .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Stage */
main{max-width:1040px;margin:0 auto;padding:18px 20px 110px}
.step-view{animation:stepIn .45s ease both}
@keyframes stepIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.step-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 14px}
.step-head h1{margin:0;font-size:28px;letter-spacing:-.02em;color:var(--navy);line-height:1.2}
.kicker{font-size:13px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.08em}
.instructions{display:flex;gap:10px;align-items:flex-start;background:var(--blue-50);border:1px solid #d3e2fc;color:#1d3f8a;border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:15px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px;border:1px solid rgba(219,232,238,.7)}
.card h2{margin:0 0 10px;font-size:20px;color:var(--navy);letter-spacing:-.01em}
.card h3{margin:0 0 8px;font-size:16px;color:var(--navy)}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* Buttons */
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(13,148,136,.3)}
.btn-primary:hover{background:#0b7f75}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn-ghost:hover{background:#f6fafb}
.btn-soft{background:var(--teal-50);color:var(--teal)}
.btn-soft:hover{background:var(--teal-100)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.icon-btn{border:0;background:var(--teal-50);color:var(--teal);width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-size:16px;flex:none;transition:.15s}
.icon-btn:hover{background:var(--teal-100);transform:scale(1.06)}

/* Footer nav */
.footer-nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.footer-inner{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.footer-inner .status{flex:1;text-align:center;color:var(--muted);font-weight:600;font-size:14px}

/* Clickable words */
.w{cursor:pointer;border-radius:5px;padding:0 1px;transition:background .15s,color .15s;border-bottom:1.5px dotted rgba(13,148,136,.45)}
.w:hover{background:var(--teal-50);color:var(--teal)}
.w.seen{border-bottom-color:transparent;background:rgba(20,184,166,.08)}
.w.active{background:var(--teal);color:#fff}
.hl-modals .w.modal{background:#fff1d6;color:#9a5b00;border-bottom:2px solid var(--warn);font-weight:700}

/* Dialogue */
.scene{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#0f766e,#1d4ed8);color:#fff;border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.scene .bed{font-size:38px}
.scene b{display:block;font-size:17px}
.scene span{opacity:.9;font-size:14px}
.dialog-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.explore-meter{margin-left:auto;font-weight:700;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.meter{width:110px;height:8px;border-radius:9px;background:#e4eef2;overflow:hidden}
.meter i{display:block;height:100%;background:var(--warn);transition:width .3s}
.chat{display:flex;flex-direction:column;gap:12px}
.line{display:flex;gap:12px;align-items:flex-start;animation:stepIn .4s both}
.line.P{flex-direction:row-reverse}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#fff;box-shadow:var(--shadow);flex:none}
.line.A .avatar{background:var(--teal-50)}
.line.P .avatar{background:#eef2ff}
.bubble{max-width:74%;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative}
.line.A .bubble{border-top-left-radius:6px}
.line.P .bubble{border-top-right-radius:6px;background:#f6f8ff}
.bubble .who{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:2px}
.bubble .de{font-size:18px;line-height:1.7;color:var(--navy)}
.bubble .en{font-size:14px;color:var(--muted);margin-top:4px;display:none;font-style:italic}
.show-en .bubble .en{display:block}
.bubble.speaking{box-shadow:0 0 0 3px var(--teal-2),var(--shadow)}
.say{border:0;background:none;color:var(--teal);font-size:14px;padding:0 4px;border-radius:6px}
.say:hover{background:var(--teal-50)}

/* Popup */
.pop{position:fixed;z-index:60;width:330px;background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(15,42,61,.25);border:1px solid var(--line);padding:16px;opacity:0;transform:translateY(6px) scale(.97);pointer-events:none;transition:opacity .18s,transform .18s}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.pop .pic{width:68px;height:68px;border-radius:16px;background:linear-gradient(135deg,var(--teal-50),var(--blue-50));display:grid;place-items:center;font-size:38px;flex:none}
.pop .word{font-size:21px;font-weight:800;color:var(--navy);line-height:1.15;overflow-wrap:break-word}
.pop .word .art{display:block;font-size:15px}
.pop .art{font-weight:800}
.art-der{color:var(--der)} .art-die{color:var(--die)} .art-das{color:var(--das)}
.pop .pos{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);background:var(--teal-50);border-radius:6px;padding:2px 7px;margin:6px 0}
.pop .en{font-size:17px;font-weight:600;color:var(--ink);clear:none}
.pop .pl{font-size:14px;color:var(--muted);margin-top:4px}
.pop .note{clear:both;font-size:13.5px;background:var(--warn-50);border-radius:10px;padding:8px 10px;margin-top:10px;color:#7a4b06}
.pop .actions{clear:both;display:flex;gap:8px;margin-top:12px}
.pop .close{position:absolute;top:6px;right:8px;border:0;background:none;font-size:18px;color:var(--muted);display:none}
.backdrop{position:fixed;inset:0;z-index:55;background:rgba(15,42,61,.25);display:none}

/* Grammar */
.oa-hero{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
.oa-hero svg{width:100%;height:auto}
.oa-hero p{margin:0 0 10px;font-size:16px}
.queue{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.queue .slot{flex:1;min-width:90px;text-align:center;border-radius:12px;padding:8px 6px;font-size:13px;font-weight:700;border:2px dashed var(--line);color:var(--muted)}
.queue .slot.s2{border-color:var(--warn);background:var(--warn-50);color:#92590a}
.queue .slot.end{border-color:var(--blue);background:var(--blue-50);color:var(--blue)}
.bracket-stage{background:linear-gradient(180deg,#f8fcfd,#f1f8fa);border:1px solid var(--line);border-radius:16px;padding:26px 18px 18px;position:relative;overflow:hidden}
.sentence{display:flex;justify-content:center;align-items:flex-start;gap:10px;flex-wrap:nowrap;position:relative;min-height:92px;padding-bottom:34px}
.tok{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.tok .chip{padding:10px 16px;border-radius:12px;font-size:20px;font-weight:700;background:#fff;border:2px solid var(--line);color:var(--navy);white-space:nowrap;box-shadow:0 2px 6px rgba(15,42,61,.06)}
.tok .pos-l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tok.subj .chip{border-color:#c7d2fe;background:#eef2ff}
.tok.verb .chip{border-color:#93c5fd;background:var(--blue-50);color:var(--blue)}
.tok.inf .chip{border-color:var(--blue);background:var(--blue);color:#fff}
.tok.modal .chip{border-color:var(--warn);background:#fff3d6;color:#8a4b00}
.tok.modal .chip::before{content:"👨‍⚕️";font-family:"Noto Color Emoji",sans-serif;margin-right:6px;font-size:.9em}
.tok.enter .chip{animation:dropIn .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes dropIn{from{transform:translateY(-60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.bracket{position:absolute;bottom:4px;height:22px;border:3px solid var(--warn);border-top:0;border-radius:0 0 14px 14px;transform-origin:left;transform:scaleX(0);opacity:0;transition:transform .6s .25s ease,opacity .3s .25s}
.bracket.on{transform:scaleX(1);opacity:1}
.bracket span{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-size:12px;font-weight:800;color:#92590a;white-space:nowrap;background:#fff3d6;padding:1px 8px;border-radius:99px}
.sent-en{text-align:center;color:var(--muted);font-style:italic;margin-top:16px;min-height:24px}
.anim-controls{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.qrule{margin-top:14px;background:#fff;border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px;font-size:15px}
.meanings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mcard{border-radius:14px;padding:14px;border:1px solid var(--line);background:#fbfdfe;transition:transform .2s,box-shadow .2s}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.mcard .top{display:flex;align-items:center;gap:8px}
.mcard .em{font-size:24px}
.mcard .mv{font-weight:800;font-size:18px;color:var(--navy)}
.mcard .men{font-weight:600;color:var(--teal);font-size:14px}
.mcard .use{font-size:13px;color:var(--muted);margin:2px 0 8px}
.mcard .ex{font-size:15px;color:var(--navy);display:flex;gap:6px;align-items:flex-start}
.mcard .exen{font-size:13px;color:var(--muted);font-style:italic}
.warnbox{border-radius:16px;padding:16px 18px;background:linear-gradient(135deg,#fff7ed,#fff1f2);border:1px solid #fecdd3}
.warnbox h3{color:#9f1239}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.vs .it{border-radius:12px;padding:12px;background:#fff;border:2px solid var(--line)}
.vs .it.ok{border-color:#86efac}
.vs .it.stop{border-color:#fda4af}
.vs .it b{display:block;font-size:17px;color:var(--navy)}
.conj-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
table.conj{width:100%;border-collapse:separate;border-spacing:0;font-size:16px;overflow:hidden;border-radius:14px;border:1px solid var(--line)}
table.conj th,table.conj td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
table.conj thead th{background:var(--navy);color:#fff;font-size:15px}
table.conj tbody tr:last-child td{border-bottom:0}
table.conj td.p{color:var(--muted);font-weight:600;width:120px;background:#f8fbfc}
table.conj tr.same td{background:#fffaf0}
table.conj tr.same td.p{background:#fff3d6}
.stem-sg{color:#c2410c;font-weight:800}
.stem-pl{color:var(--teal);font-weight:700}
.end{color:#7c3aed;font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:10px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tips{margin:12px 0 0;padding-left:20px;font-size:14.5px}
.tips li{margin:3px 0}
.conj-fade{animation:stepIn .35s both}

/* Quiz / MC */
.q{margin-bottom:16px}
.q .qt{font-weight:700;color:var(--navy);margin-bottom:8px;font-size:16.5px}
.q .qen{font-size:13.5px;color:var(--muted);margin:-6px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:600;color:var(--ink);transition:.15s}
.opt:hover:not(:disabled){border-color:var(--teal-2);background:var(--teal-50)}
.opt.right{border-color:var(--ok);background:var(--ok-50);color:#14532d}
.opt.wrong{border-color:var(--bad);background:var(--bad-50);color:#9f1239;animation:shake .4s}
.opt:disabled{cursor:default}
.fb{margin-top:8px;font-size:14.5px;border-radius:10px;padding:8px 12px;animation:stepIn .3s both}
.fb.ok{background:var(--ok-50);color:#14532d}
.fb.bad{background:var(--bad-50);color:#9f1239}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* Chips & drag */
.bank{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:16px;background:#f6fafb;border:2px dashed var(--line);min-height:64px;align-items:center;justify-content:center}
.dchip{touch-action:none;user-select:none;-webkit-user-select:none;padding:9px 16px;border-radius:12px;background:#fff;border:2px solid var(--teal-2);color:var(--teal);font-weight:800;font-size:17px;box-shadow:0 3px 0 var(--teal-100);cursor:grab;transition:transform .12s,box-shadow .12s,opacity .2s,background .15s}
.dchip:hover{transform:translateY(-2px)}
.dchip.selected{background:var(--teal);color:#fff;box-shadow:0 0 0 4px var(--teal-100)}
.dchip.dragging{opacity:.3}
.ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg) scale(1.06);box-shadow:0 14px 30px rgba(15,42,61,.25)!important;opacity:.95}
.gap-items{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.gitem{background:#fff;border-radius:16px;border:1px solid var(--line);padding:14px 16px;box-shadow:0 2px 8px rgba(15,42,61,.04);transition:border-color .2s}
.gitem.solved{border-color:#86efac;background:#fbfffc}
.gitem .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:19px;color:var(--navy)}
.gitem .num{width:28px;height:28px;border-radius:50%;background:var(--teal-50);color:var(--teal);font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
.gitem .who{font-size:15px;opacity:.8}
.gap{display:inline-flex;align-items:center;justify-content:center;min-width:110px;height:42px;border-radius:12px;border:2px dashed #9fb8c4;background:#f8fbfc;color:#9fb8c4;font-weight:800;padding:0 12px;transition:.2s}
.gap.hover,.drop-hover{border-color:var(--teal)!important;background:var(--teal-50)!important;transform:scale(1.04)}
.gap.armed{border-color:var(--teal-2);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--teal-100)}}
.gap.filled{border-style:solid;border-color:var(--ok);background:var(--ok-50);color:#15803d;animation:pop .35s}
.gap.wrong{border-color:var(--bad);background:var(--bad-50);color:var(--bad);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.12)}}
.gitem .en{font-size:14px;color:var(--muted);font-style:italic;margin:6px 0 0 38px}

/* Builder */
.bitem{margin-bottom:16px}
.bitem .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bitem .head .en{color:var(--muted);font-style:italic}
.answer-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:62px;padding:10px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);margin-bottom:10px;position:relative;transition:border-color .2s,background .2s}
.answer-line.empty::before{content:attr(data-ph);color:#a3b8c3;font-size:15px}
.answer-line.ok{border-color:var(--ok);background:var(--ok-50)}
.answer-line.bad{border-color:var(--bad);animation:shake .4s}
.answer-line .punct{font-size:22px;font-weight:800;color:var(--navy);margin-left:-4px}
.answer-line .dchip{background:var(--blue-50);border-color:#93c5fd;color:var(--blue);box-shadow:0 3px 0 #dbeafe}
.answer-line.ok .dchip{background:#fff;border-color:#86efac;color:#15803d;box-shadow:none;cursor:default}
.insert-mark{width:4px;height:36px;border-radius:4px;background:var(--teal);animation:pulse 1s infinite}
.bactions{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}

/* Picture match */
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.pic-card{background:#fff;border-radius:18px;border:2px solid var(--line);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;transition:.2s;box-shadow:0 2px 8px rgba(15,42,61,.04)}
.pic-card .art-box{width:100%;aspect-ratio:16/8;max-height:140px;border-radius:14px;background:linear-gradient(135deg,#f0faf8,#eef4fe);display:grid;place-items:center}
.pic-card .art-box svg{height:88%;width:auto;max-width:90%}
.pic-card .slot{width:100%;min-height:46px;border-radius:12px;border:2px dashed #b6cbd5;display:flex;align-items:center;justify-content:center;color:#a3b8c3;font-size:14px;font-weight:600;transition:.2s}
.pic-card.armed .slot{border-color:var(--teal-2);animation:pulse 1.2s infinite}
.pic-card.matched{border-color:#86efac}
.pic-card.matched .slot{border:0;background:var(--ok-50);color:#14532d;flex-direction:column;padding:6px 8px;font-size:13px;text-align:center}
.pic-card.matched .slot > span{display:block}
.pic-card.matched .slot b{font-size:17px;color:var(--navy)}
.pic-card.wrong{animation:shake .4s;border-color:var(--bad)}
.pic-card.matched .art-box{animation:pop .4s}

/* Reading */
.reading-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;align-items:start}
.paper{background:#fffdf8;border-radius:6px 18px 18px 18px;box-shadow:var(--shadow);padding:24px 26px;border:1px solid #efe6d2;position:relative;font-size:17px;line-height:1.75;color:#2b2b2b}
.paper::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--teal),var(--blue));border-radius:6px 0 0 6px}
.paper .lh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #efe6d2;padding-bottom:10px;margin-bottom:12px}
.paper h3{font-size:19px;margin:0 0 10px;color:var(--navy)}
.paper p{margin:0 0 8px}
.paper .sig{margin-top:14px;font-style:italic;color:#555;font-size:15px}
.paper .stamp{position:absolute;right:18px;bottom:16px;transform:rotate(-12deg);border:2px solid rgba(13,148,136,.45);color:rgba(13,148,136,.6);font-weight:800;border-radius:8px;padding:2px 8px;font-size:12px;letter-spacing:.08em}

/* Summary */
.sum-hero{text-align:center;padding:30px 22px;background:linear-gradient(135deg,#0f766e,#1d4ed8);color:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;position:relative;overflow:hidden}
.sum-hero h2{color:#fff;font-size:30px;margin:6px 0}
.big-stars{font-size:54px;letter-spacing:8px;margin:6px 0}
.big-stars span{display:inline-block;animation:starIn .6s cubic-bezier(.3,1.7,.5,1) both}
.big-stars span.off{filter:grayscale(1) brightness(1.6);opacity:.4}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.score-big{font-size:20px;font-weight:700;opacity:.95}
.breakdown{display:grid;gap:10px}
.bd-row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:14.5px}
.bd-row .bar{height:10px;border-radius:9px;background:#e4eef2;overflow:hidden}
.bd-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:9px;transition:width .8s}
.bd-row .v{text-align:right;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.redemittel{display:grid;gap:8px}
.rm{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#f8fbfc;border:1px solid var(--line)}
.rm b{color:var(--navy);font-size:16.5px;display:block}
.rm span{color:var(--muted);font-size:14px}
.confetti{position:absolute;width:8px;height:14px;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(420px) rotate(720deg);opacity:0}}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:90;pointer-events:none;font-size:14.5px}
.toast.show{opacity:1;transform:translateX(-50%)}
.plus{position:fixed;z-index:95;font-weight:800;color:#b45309;pointer-events:none;animation:floatUp 1s ease-out forwards;font-size:18px}
@keyframes floatUp{to{transform:translateY(-50px);opacity:0}}

      lastY = ev.clientY;
      if (!ghost) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
        clearSel(); closePop();
        ghost = elm.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('selected');
        document.body.appendChild(ghost); elm.classList.add('dragging');
        raf = requestAnimationFrame(edge);
      }
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      const t = dropAt(ev.clientX, ev.clientY);
      if (t !== over) { over && over.classList.remove('drop-hover'); over = t; over && over.classList.add('drop-hover'); }
      onMove && onMove(ev, t);
    };
    const up = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      over && over.classList.remove('drop-hover'); cancelAnimationFrame(raf);
      if (ghost) { ghost.remove(); elm.classList.remove('dragging'); if (ev.type !== 'pointercancel') onDrop(dropAt(ev.clientX, ev.clientY), ev); }
      else if (ev.type !== 'pointercancel') onTap(ev);

    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}

function renderMC(q, key, host) {
  const st = S.mc[key] || (S.mc[key] = { wrong: [], solved: false });
  const box = el(`<div class="q"><div class="qt">${esc(q.q)}</div>${q.qEn ? `<div class="qen">${esc(q.qEn)}</div>` : ''}<div class="opts"></div><div class="fbh"></div></div>`);
  const opts = $('.opts', box), fbh = $('.fbh', box);
  const showFb = (ok) => { fbh.innerHTML = ok ? `<div class="fb ok">✓ Richtig! ${esc(q.why)}</div>` : `<div class="fb bad">✗ Not quite. Try again!</div>`; };
  q.options.forEach((o, i) => {
    const b = el(`<button class="opt">${q.kind === 'tf' ? (i === 0 ? '✔ ' : '✘ ') : ''}${esc(o)}</button>`);
    if (st.wrong.includes(i)) { b.classList.add('wrong'); b.disabled = true; b.style.animation = 'none'; }
    if (st.solved && i === q.answer) b.classList.add('right');
    if (st.solved) b.disabled = true;
    b.onclick = () => {
      if (st.solved) return;
      if (i === q.answer) {
        st.solved = true; b.classList.add('right'); $$('.opt', opts).forEach(x => x.disabled = true);
        award(key, st.wrong.length ? SC.afterRetry : SC.firstTry, b); showFb(true);
      } else { st.wrong.push(i); b.classList.add('wrong'); b.disabled = true; showFb(false); }
      updateStatus();
    };
    opts.appendChild(b);
  });
  if (st.solved) showFb(true);
  host.appendChild(box);
}

  const text = () => mode === 'before' ? ex.before.map(t => t.t).join(' ') + '.' : [ex.before[0].t, ex.modal, ...ex.before.filter(t => t.r === 'rest').map(t => t.t), ex.before.find(t => t.r === 'verb').inf].join(' ') + '.';

    const modal = el(`<div class="tok modal enter" data-r="modal"><div class="chip">${esc(ex.modal)}</div><div class="pos-l">Pos 2 · modal</div></div>`);
    const br = $('.bracket', sent);
    sent.insertBefore(modal, br);
    rest.forEach(r => { sent.insertBefore(r, br); $('.pos-l', r).textContent = 'middle'; });
    sent.insertBefore(verb, br);
    $('.chip', verb).textContent = ex.before.find(t => t.r === 'verb').inf;
    verb.classList.remove('verb'); verb.classList.add('inf'); $('.pos-l', verb).textContent = 'END · infinitive';
    subj.after(modal);
    toks.forEach(t => {
      const dx = first.get(t) - t.getBoundingClientRect().left;

}

R.builder = (step) => {
  const st = S.builder;
  const v = el(`<div></div>`);
  v.appendChild(el(`<div class="instructions"><span class="emoji">🧩</span><span>${esc(step.instructions)}</span></div>`));
  step.items.forEach((it, i) => {
    if (!st.lines[i]) st.lines[i] = [];
    const order = shuffleNotIdentity(it.tiles.map((_, k) => k), i + 7);
    const card = el(`<div class="card bitem"><div class="head"><span class="num" style="width:28px;height:28px;border-radius:50%;background:#e6f7f5;color:#0d9488;font-weight:800;display:grid;place-items:center">${i + 1}</span><span class="en">“${esc(it.en)}”</span></div>
      <div class="answer-line" data-drop="line" data-ph="Drop the words here …"></div>
      <div class="bank" data-drop="bank"></div>
      <div class="bactions"><button class="btn btn-primary chk">Check</button><button class="btn btn-ghost rst">↺ Reset</button><button class="btn btn-soft say2" style="display:none">🔊 Listen</button></div><div class="fbh"></div></div>`);
    const line = $('.answer-line', card), bank = $('.bank', card), fbh = $('.fbh', card), chk = $('.chk', card);
    const sentence = () => st.lines[i].map(k => it.tiles[k]).join(' ');
    let mark = null;
    const removeMark = () => { mark && mark.remove(); mark = null; };
    const insertIndex = (x, y, exclude) => {
      const chips = $$('.dchip', line).filter(c => c !== exclude);
      for (let n = 0; n < chips.length; n++) {
        const r = chips[n].getBoundingClientRect(), cy = r.top + r.height / 2, cx = r.left + r.width / 2;
        if (y < r.top - 4) return n;
        if (Math.abs(y - cy) <= r.height / 2 + 4 && x < cx) return n;
      }
      return chips.length;
    };
    const draw = () => {
      line.innerHTML = ''; bank.innerHTML = '';
      const solved = st.solved[i];
      st.lines[i].forEach(k => line.appendChild(tile(k, true)));
      if (st.lines[i].length) line.appendChild(el(`<span class="punct">${esc(it.punct)}</span>`));
      line.classList.toggle('empty', !st.lines[i].length);
      line.classList.toggle('ok', !!solved);
      order.filter(k => !st.lines[i].includes(k)).forEach(k => bank.appendChild(tile(k, false)));
      bank.style.display = solved ? 'none' : '';
      chk.disabled = solved || st.lines[i].length !== it.tiles.length;
      chk.style.display = solved ? 'none' : ''; $('.rst', card).style.display = solved ? 'none' : '';
      $('.say2', card).style.display = solved ? '' : 'none';
      if (solved) fbh.innerHTML = `<div class="fb ok">✓ Perfekt! „${esc(sentence() + it.punct)}“ The Oberarzt is in place and the infinitive is at the end.</div>`;
      updateStatus();
    };
    const tile = (k, inLine) => {
      const t = el(`<div class="dchip">${esc(it.tiles[k])}</div>`);
      if (st.solved[i]) return t;
      draggable(t, {
        onTap: () => {
          const a = st.lines[i];
          if (inLine) a.splice(a.indexOf(k), 1); else a.push(k);
          fbh.innerHTML = ''; line.classList.remove('bad'); draw();
        },
        onMove: (ev, tg) => {
          if (tg === line) {
            const idx = insertIndex(ev.clientX, ev.clientY, t);
            const chips = $$('.dchip', line).filter(c => c !== t);
            if (!mark) mark = el('<span class="insert-mark"></span>');
            if (chips[idx]) line.insertBefore(mark, chips[idx]); else line.insertBefore(mark, $('.punct', line));
          } else removeMark();
        },
        onDrop: (tg, ev) => {
          removeMark();
          const a = st.lines[i];
          if (tg === line) {
            const idx = insertIndex(ev.clientX, ev.clientY, t);
            const pos = a.indexOf(k); if (pos > -1) a.splice(pos, 1);
            a.splice(Math.min(idx, a.length), 0, k);
          } else if (tg === bank && inLine) a.splice(a.indexOf(k), 1);
          fbh.innerHTML = ''; line.classList.remove('bad'); draw();
        }
      });
      return t;
    };
    chk.onclick = () => {
      const s = sentence().toLowerCase();
      if (it.answers.some(a => a.toLowerCase() === s)) {
        st.solved[i] = true; award('b:' + i, st.tries[i] ? SC.afterRetry : SC.firstTry, chk); draw(); speak(sentence() + it.punct);
      } else {
        st.tries[i] = (st.tries[i] || 0) + 1;
        const words = st.lines[i].map(k => it.tiles[k]);
        let msg;
        if (words[words.length - 1] !== it.inf) msg = `The infinitive „${it.inf}“ goes to the very end. Back of the queue!`;
        else if (it.question && words[0] !== it.modal) msg = `In a yes/no question the modal verb („${it.modal}“) comes first.`;
        else msg = `Remember: the modal („${it.modal}“) stands in position 2, after ONE sentence part (e.g. a subject like „Die Ärztin“ or a time like „Heute“).`;
        line.classList.remove('bad'); void line.offsetWidth; line.classList.add('bad');
        fbh.innerHTML = `<div class="fb bad">✗ Not yet. ${esc(msg)}</div>`;
      }
    };
    $('.rst', card).onclick = () => { st.lines[i] = []; fbh.innerHTML = ''; line.classList.remove('bad'); draw(); };
    $('.say2', card).onclick = () => speak(sentence() + it.punct);
    draw();
    v.appendChild(card);
  });
  return v;
};

  step.items.forEach(it => {
    const done = st.done[it.id];
    const c = el(`<div class="pic-card ${done ? 'matched' : ''}" data-drop="pic" data-id="${it.id}"><div class="art-box">${SVG[it.image.id]}</div><div class="slot"></div></div>`);
    fillSlot(c, it, done);
    c.addEventListener('click', (e) => {
      if (e.target.closest('.say')) return;
      if (sel && sel.kind === 'pic') { const id = sel.value; clearSel(); tryMatch(id, it.id); }
      else if (!st.done[it.id]) toast('Pick a word first, then tap the picture');
    });
    pics.appendChild(c);
  });
  function fillSlot(c, it, done) {
    const slot = $('.slot', c);
    if (done) {
      slot.innerHTML = `<b>${label(it)} <button class="say" title="Listen">🔊</button></b><span>${esc(it.en)} · Pl.: ${esc(it.plural)}</span>`;
      $('.say', slot).onclick = () => speak(`${it.article} ${it.de}`);
    } else slot.textContent = 'Drop the word here';
  }
  function tryMatch(id, target) {
    const it = step.items.find(x => x.id === id), c = $(`.pic-card[data-id="${target}"]`, pics);
    if (st.done[target]) return;
    if (id === target) {
      st.done[id] = true; c.classList.add('matched'); fillSlot(c, it, true);
      const ch = $(`.dchip[data-id="${id}"]`, bank); ch && ch.remove();
      award('m:' + id, st.tries[id] ? SC.afterRetry : SC.firstTry, c);
      speak(`${it.article} ${it.de}`);
      if (Object.keys(st.done).length === step.items.length) { bank.style.display = 'none'; toast('🎉 All items matched!'); }
    } else {
      st.tries[id] = (st.tries[id] || 0) + 1;
      c.classList.remove('wrong'); void c.offsetWidth; c.classList.add('wrong'); setTimeout(() => c.classList.remove('wrong'), 500);
      toast(`✗ That's not ${it.article} ${it.de}. Try another picture!`);
    }
    updateStatus();
  }
  if (Object.keys(st.done).length === step.items.length) bank.style.display = 'none';
  v.appendChild(card);
  return v;
};

R.reading = (step) => {
  const d = step.document;
  const v = el(`<div></div>`);
  v.appendChild(el(`<div class="instructions"><span class="emoji">📄</span><span>${esc(step.instructions)}</span></div>`));
  const g = el(`<div class="reading-grid"></div>`);
  const paper = el(`<div class="paper"><div class="lh"><span class="emoji">🏥</span>${esc(d.letterhead)}<button class="say" style="margin-left:auto" title="Listen to the whole note">🔊 Listen</button></div>
     <h3 data-say="${esc(d.title)}">${tokenize(d.title)}</h3>${d.paragraphs.map(p => `<p data-say="${esc(p)}">${tokenize(p)}</p>`).join('')}
     <div class="sig" data-say="${esc(d.signature)}">${tokenize(d.signature)}</div><div class="stamp">ENTLASSEN</div></div>`);
  $('.say', paper).onclick = () => speak([d.title, ...d.paragraphs].join(' '));
  g.appendChild(paper);
  const qc = el(`<div class="card"><h2>❓ Questions</h2></div>`);
  step.questions.forEach((q, i) => renderMC(q, 'r:' + i, qc));
  g.appendChild(qc);
  v.appendChild(g);
  return v;
};

R.summary = (step) => {
  const t = total(), ratio = t / MAX, stars = starsFor(ratio);
  const msg = ['Keep practising, you\'ll get there! 💪', 'Good start! Review the grammar and try again.', 'Sehr gut! Great work on the ward.', 'Ausgezeichnet! You\'re ready for the ward round. 🩺'][stars];
  const v = el(`<div></div>`);
  const hero = el(`<div class="sum-hero"><div class="kicker" style="color:#99f6e4">${esc(L.platform)} · ${esc(L.level)} · ${esc(L.title)}</div><h2>${esc(step.title)}</h2>
     <div class="big-stars emoji">${[0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}" style="animation-delay:${200 + i * 220}ms">⭐</span>`).join('')}</div>
     <div class="score-big">${t} / ${MAX} points · ${Math.round(ratio * 100)}%</div><div style="margin-top:6px;opacity:.95">${msg}</div></div>`);
  v.appendChild(hero);
  if (stars >= 2) for (let i = 0; i < 40; i++) {
    const c = el(`<i class="confetti"></i>`);
    c.style.left = Math.random() * 100 + '%'; c.style.background = ['#fbbf24', '#34d399', '#60a5fa', '#f472b6', '#fff'][i % 5];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; c.style.animationDelay = (Math.random() * .6) + 's';
    hero.appendChild(c);
  }
  const grid = el(`<div class="grid2"></div>`);
  const bd = el(`<div class="card"><h2>📊 Your results</h2><div class="breakdown">${sections.map(s => { const p = sectionPts(s.key); return `<div class="bd-row"><span>${s.label}</span><span class="bar"><i style="width:0" data-w="${(p / s.max * 100).toFixed(0)}%"></i></span><span class="v">${p}/${s.max}</span></div>`; }).join('')}</div>
     <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn btn-primary" id="restart">↺ Try the lesson again</button><button class="btn btn-ghost" id="review">📖 Review grammar</button></div></div>`);
  const rm = el(`<div class="card"><h2>🗣️ Redemittel: key phrases for the ward</h2><div class="redemittel">${step.redemittel.map((r, i) => `<div class="rm"><button class="icon-btn" data-i="${i}" title="Listen">🔊</button><div><b>${esc(r.de)}</b><span>${esc(r.en)}</span></div></div>`).join('')}</div></div>`);
  $$('.icon-btn', rm).forEach(b => b.onclick = () => speak(step.redemittel[+b.dataset.i].de));
  grid.appendChild(bd); grid.appendChild(rm); v.appendChild(grid);
  $('#restart', bd).onclick = () => { S = fresh(); updateScore(); go(0); };
  $('#review', bd).onclick = () => go(STEPS.findIndex(s => s.type === 'grammar'));
  setTimeout(() => $$('.bar i', bd).forEach(i => i.style.width = i.dataset.w), 80);
  return v;
};

/* ---------- shell: progress, nav, routing ---------- */
function progressInfo(i) {
  const s = STEPS[i];
  switch (s.type) {
    case 'dialogue': { const n = Object.keys(S.pts).filter(k => k.startsWith('w:')).length; return `Explore words: ${Math.min(n, SC.wordExplorePoints)}/${SC.wordExplorePoints}`; }
    case 'grammar': return `Quick check: ${s.quiz.filter((q, k) => S.mc['gq:' + k] && S.mc['gq:' + k].solved).length}/${s.quiz.length}`;
    case 'gapfill': return `Solved: ${Object.keys(S.gap.done).length}/${s.items.length}`;
    case 'builder': return `Solved: ${Object.keys(S.builder.solved).length}/${s.items.length}`;
    case 'picturematch': return `Matched: ${Object.keys(S.match.done).length}/${s.items.length}`;
    case 'reading': return `Answered: ${s.questions.filter((q, k) => S.mc['r:' + k] && S.mc['r:' + k].solved).length}/${s.questions.length}`;
    default: return 'Well done!';
  }
}
function updateStatus() { const st = $('#status'); if (st) st.textContent = `Step ${current + 1} of ${STEPS.length} · ${progressInfo(current)}`; }

function render() {
  closePop(); clearSel(); $('#toast').classList.remove('show');
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const step = STEPS[current];
  $('#progFill').style.width = ((current) / (STEPS.length - 1) * 100) + '%';
  $$('.step-dot').forEach((d, i) => { d.classList.toggle('active', i === current); d.classList.toggle('done', i < current); });
  const main = $('#stage'); main.innerHTML = '';
  const view = el(`<section class="step-view"><div class="step-head"><div><div class="kicker">Step ${current + 1} · ${esc(step.label)}</div>${step.type === 'summary' ? '' : `<h1>${esc(step.type === 'dialogue' ? 'Listen & explore the ward round' : step.title)}</h1>`}</div></div></section>`);
  view.appendChild(R[step.type](step));
  main.appendChild(view);
  $('#back').disabled = current === 0;
  const nx = $('#next');
  nx.textContent = current === STEPS.length - 1 ? '↺ Start over' : current === STEPS.length - 2 ? 'Finish ✓' : 'Next →';
  updateStatus();
  window.scrollTo(0, 0);
}
function go(i) {
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  const h = '#step=' + (current + 1);
  if (location.hash !== h) history.replaceState(null, '', h);
  render();
}
function fromHash() { const m = /step=(\d+)/.exec(location.hash); return m ? (+m[1] - 1) : 0; }

function init() {
  document.title = `${L.platform} · ${L.level} · ${L.title}`;
  $('#brand').innerHTML = `${SVG.logo}<span>Medi<b>Deutsch</b></span>`;
  $('#lvl').textContent = `${L.level} · ${L.unit} · Grammar`;
  $('#ttl').textContent = `${L.title}: ${L.subtitle.split(':')[0]}`;
  const dots = $('#dots');
  STEPS.forEach((s, i) => { const d = el(`<button class="step-dot" title="${esc(s.label)}"><span class="n">${i + 1}</span><span class="l">${esc(s.label)}</span></button>`); d.onclick = () => go(i); dots.appendChild(d); });
  $('#back').onclick = () => go(current - 1);
  $('#next').onclick = () => { if (current === STEPS.length - 1) { S = fresh(); updateScore(); go(0); } else go(current + 1); };
  window.addEventListener('hashchange', () => { const i = fromHash(); if (i !== current) go(i); });
  updateScore();
  go(fromHash());
}
init();
})();

</script>
